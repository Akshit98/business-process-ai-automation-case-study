<svg xmlns="http://www.w3.org/2000/svg" width="820" height="950" viewBox="0 0 820 950" role="img" aria-label="Proposed future-state workflow"><style>text{font-family:Arial,sans-serif;fill:#152c43}.head{font-size:20px;font-weight:bold}.body{font-size:16px}</style><rect width="820" height="950" fill="white"/><text x="40" y="44" class="head">Proposed future-state workflow</text><text x="40" y="74" class="body">Akshit Didla | Independent design case study</text><rect x="40" y="106" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="136" class="head">01  Capture &amp; own</text><text x="60" y="162" class="body">Record source, contact and sales owner · Sales owner</text><path d="M410 186v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="206" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="236" class="head">02  Review discovery</text><text x="60" y="262" class="body">Approve notes, scope and next action · Sales owner</text><path d="M410 286v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="306" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="336" class="head">03  Validate readiness</text><text x="60" y="362" class="body">Return missing required fields for correction · Sales owner</text><path d="M410 386v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="406" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="436" class="head">04  Approve agreement</text><text x="60" y="462" class="body">Confirm signed agreement and scope version · Sales + delivery</text><path d="M410 486v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="506" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="536" class="head">05  Create once</text><text x="60" y="562" class="body">Create or retrieve a linked Asana project · Automation + operations</text><path d="M410 586v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="606" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="636" class="head">06  Check capacity</text><text x="60" y="662" class="body">Approve consultant and target start date · Delivery lead</text><path d="M410 686v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="706" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="736" class="head">07  Review progress</text><text x="60" y="762" class="body">Track milestones; approve client updates · Project lead</text><path d="M410 786v20m-4-5 4 5 4-5" fill="none" stroke="#146c72" stroke-width="2"/><rect x="40" y="806" width="740" height="80" rx="8" fill="#eef4f8"/><text x="60" y="836" class="head">08  Reconcile billing</text><text x="60" y="862" class="body">Approve time against contractual billing basis · Delivery + finance</text><text x="40" y="938" class="body">Scenario-based analysis. Proposed changes have not been implemented.</text></svg>